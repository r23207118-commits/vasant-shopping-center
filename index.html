<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>वसंत शॉपिंग सेंटर</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">🛍️ वसंत शॉपिंग सेंटर</div><p>तुमच्या आवडीची खरेदी, एकाच ठिकाणी</p>
<input id="search" placeholder="उत्पादन शोधा..."><select id="category"><option value="">सर्व प्रकार</option><option>Electronics</option><option>Fashion</option><option>Home</option></select>
</header><main><section class="hero"><h1>ऑनलाइन खरेदीचे स्वागत आहे!</h1><p>नवीन उत्पादने आणि खास ऑफर्स पाहा.</p></section>
<div class="layout"><section><h2>उत्पादने</h2><div id="products" class="products"></div></section>
<aside><h2>तुमची बॅग</h2><div id="cart"></div><p id="total">एकूण: ₹0</p><h3>ऑर्डर तपशील</h3>
<input id="customer" placeholder="तुमचे नाव"><input id="phone" placeholder="मोबाईल नंबर"><textarea id="address" placeholder="पूर्ण पत्ता"></textarea>
<button id="checkout">Cash on Delivery ऑर्डर करा</button><p id="message"></p></aside></div></main>
<footer>© वसंत शॉपिंग सेंटर · डेमो वेबसाइट</footer><script src="/app.js"></script></body></html>
